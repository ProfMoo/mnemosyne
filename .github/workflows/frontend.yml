name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.2.3
      - run: npm ci
      - run: npm run generate:check
      - run: npm run check
      - name: Build Full App
        working-directory: .
        run: docker build -t mnemosyne .
