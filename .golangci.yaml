# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod
  allow-serial-runners: true

linters:
  # Explicit list keeps tool upgrades from silently changing policy.
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - loggercheck
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        structured-logging:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: "log$"
              desc: Use log/slog for structured logging.
        frontend-api-only:
          list-mode: lax
          files:
            - "**/internal/ui/**/*.go"
            - "**/internal/frontendbuild/**/*.go"
            - "**/cmd/frontend/**/*.go"
            - "**/cmd/frontend-export/**/*.go"
          deny:
            - pkg: github.com/profmoo/mnemosyne/internal/config
              desc: Frontend owns separate configuration.
            - pkg: github.com/profmoo/mnemosyne/internal/server
              desc: Access backend only through the generated HTTP client.
            - pkg: github.com/profmoo/mnemosyne/internal/database
              desc: Frontend must not access backend database code.
            - pkg: github.com/profmoo/mnemosyne/internal/listens
              desc: Frontend must not call backend services directly.
            - pkg: github.com/profmoo/mnemosyne/db
              desc: Frontend must not access backend storage.
            - pkg: github.com/profmoo/mnemosyne/gen/api
              desc: Use gen/client, not server bindings.
        backend-static-only:
          list-mode: lax
          files:
            - "**/cmd/mnemosyne/**/*.go"
            - "**/internal/server/**/*.go"
          deny:
            - pkg: github.com/maxence-charriere/go-app
              desc: Backend serves static files without go-app.
            - pkg: github.com/profmoo/mnemosyne/internal/ui
              desc: UI code belongs in the browser or build tools.
            - pkg: github.com/profmoo/mnemosyne/internal/frontendbuild
              desc: Export assets during build, not server runtime.
    cyclop:
      max-complexity: 10
      package-average: 5
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      check:
        - switch
        - mapliteral
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
    govet:
      enable-all: true
    nakedret:
      max-func-lines: 0
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          arguments:
            - 120
        - name: cognitive-complexity
          arguments:
            - 15
        - name: cyclomatic
          arguments:
            - 10
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
  exclusions:
    generated: strict
    warn-unused: true

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/profmoo/mnemosyne
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/profmoo/mnemosyne)
      custom-order: true
    golines:
      max-len: 120
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
