rules:
  component-name-no-double-underscore:
    description: Component names must not contain double underscores.
    severity: error
    resolved: false
    given: "$.components.*"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          propertyNames:
            pattern: "^(?!.*__).*$"
  schema-property-example-required:
    description: Typed schema properties must include example or nonempty examples.
    severity: warn
    resolved: true
    # /1/submit-listens is ListenBrainz spec compatible, so this project doesn't own that spec.
    # Will allow that endpoint to be non-compliant generally, as maintaining compatibility is
    # more important than having a consistent schema.
    given:
      - "$.paths[?(@property !== '/1/submit-listens')]..properties[?(@.type)]"
      - "$.components.schemas[?(@property !== 'SingleSubmission' && @property !== 'ImportSubmission' && @property !== 'PlayingNowSubmission' && @property !== 'CompletedListen' && @property !== 'PlayingNowListen' && @property !== 'TrackMetadata' && @property !== 'AdditionalInfo')]..properties[?(@.type)]"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required:
                - example
            - required:
                - examples
              properties:
                examples:
                  type: array
                  minItems: 1
