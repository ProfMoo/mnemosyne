openapi: 3.1.2
info:
  title: Mnemosyne API
  version: 0.1.0
  description: API for Mnemosyne
paths:
  /hello:
    get:
      operationId: getHello
      summary: Say hello
      responses:
        "200":
          description: A hello world greeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
  /listens:
    get:
      operationId: getListens
      summary: Get all listens
      responses:
        "200":
          description: A list of listens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListListensResponse"
  /listens/{listen_id}:
    get:
      operationId: getListen
      summary: Get a listen by ID
      responses:
        "200":
          description: A listen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetListenResponse"
components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Hello, World!
    ListListensResponse:
      type: object
      required:
        - listens
      properties:
        listens:
          type: array
          items:
            $ref: "#/components/schemas/Listen"
    GetListenResponse:
      $ref: "#/components/schemas/Listen"
    Listen:
      type: object
      required:
        - id
        - artists
        - albumArtists
        - album
        - track
        - startedAt
        - endedAt
      properties:
        id:
          type: string
          format: uuid
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        albumArtists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        album:
          type: object
          required:
            - name
            - id
            - mbid
          properties:
            name:
              type: string
            id:
              type: string
              format: uuid
            mbid:
              type: string
              format: uuid
        track:
          type: object
          required:
            - name
            - id
            - mbid
          properties:
            name:
              type: string
            id:
              type: string
              format: uuid
            mbid:
              type: string
              format: uuid
        startedAt:
          type: string
          format: date-time
          example: 2026-01-01T00:00:00Z
          description: The time the listen started. UTC ISO 8601 format.
        endedAt:
          type: string
          format: date-time
          example: 2026-01-01T00:00:00Z
          description: The time the listen ended. UTC ISO 8601 format.
    Artist:
      type: object
      required:
        - name
        - id
        - mbid
      properties:
        name:
          type: string
        id:
          type: string
          format: uuid
        mbid:
          type: string
          format: uuid
