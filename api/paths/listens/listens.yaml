get:
    operationId: getListens
    summary: Get all listens
    responses:
      "200":
        description: A list of listens.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ListListensResponse"
      "500":
        description: An error occurred.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ErrorResponse"
