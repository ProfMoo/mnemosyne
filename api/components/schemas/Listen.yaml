type: object
required:
  - id
  - createdAt
  - updatedAt
  - recording
properties:
  id:
    type: string
    format: uuid
    example: 2f6b8c90-1234-4abc-8def-1234567890ab
  createdAt:
    type: string
    format: date-time
    example: "2026-01-01T00:00:00Z"
    description: When this listen was created, not when playback started.
  updatedAt:
    type: string
    format: date-time
    example: "2026-01-01T00:00:00Z"
  recording:
    $ref: "../../openapi.yaml#/components/schemas/Recording"
